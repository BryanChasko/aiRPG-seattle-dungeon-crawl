<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Read the room move">
  <title>Read the Room</title>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="46" height="46" rx="8" fill="#0B0E14" stroke="#FF2BD6" stroke-width="2"/>
  <circle cx="24" cy="24" r="15" fill="none" stroke="#1FBF75" stroke-width="2"/>
  <circle cx="24" cy="24" r="9" fill="none" stroke="#1FBF75" stroke-width="1.5" opacity="0.7"/>
  <g class="motion">
    <path d="M24,24 L24,10 A14,14 0 0 1 34,14 Z" fill="#FF2BD6" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="24" cy="24" r="3" fill="#FF8A3D"/>
  </g>
  <g class="static">
    <path d="M24,24 L24,10 A14,14 0 0 1 34,14 Z" fill="#FF2BD6" opacity="0.85"/>
    <circle cx="24" cy="24" r="3" fill="#FF8A3D"/>
  </g>
</svg>
