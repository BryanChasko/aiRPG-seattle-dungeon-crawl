<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Choreography move">
  <title>Choreography</title>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="46" height="46" rx="8" fill="#0B0E14" stroke="#FF2BD6" stroke-width="2"/>
  <g class="motion">
    <line x1="12" y1="32" x2="24" y2="14" stroke="#1FBF75" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="24" y1="14" x2="36" y2="32" stroke="#1FBF75" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="14" dur="1s" repeatCount="indefinite"/>
    </line>
    <circle cx="12" cy="32" r="5" fill="#FF8A3D"/>
    <circle cx="24" cy="14" r="5" fill="#FF8A3D"/>
    <circle cx="36" cy="32" r="5" fill="#FF8A3D"/>
  </g>
  <g class="static">
    <line x1="12" y1="32" x2="24" y2="14" stroke="#1FBF75" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="24" y1="14" x2="36" y2="32" stroke="#1FBF75" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="12" cy="32" r="5" fill="#FF8A3D"/>
    <circle cx="24" cy="14" r="5" fill="#FF8A3D"/>
    <circle cx="36" cy="32" r="5" fill="#FF8A3D"/>
  </g>
</svg>
