<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Power move">
  <title>Power</title>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="46" height="46" rx="8" fill="#0B0E14" stroke="#FF8A3D" stroke-width="2"/>
  <g transform="translate(24,24)">
    <g class="motion">
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="1.6s" repeatCount="indefinite"/>
      <polygon points="0,-16 4,-6 14,-8 8,0 16,6 5,5 4,16 0,6 -5,15 -5,4 -16,5 -8,-1 -14,-9 -4,-5" fill="#FF8A3D"/>
      <circle r="4" fill="#0B0E14" stroke="#FF2BD6" stroke-width="2"/>
    </g>
    <g class="static">
      <polygon points="0,-16 4,-6 14,-8 8,0 16,6 5,5 4,16 0,6 -5,15 -5,4 -16,5 -8,-1 -14,-9 -4,-5" fill="#FF8A3D"/>
      <circle r="4" fill="#0B0E14" stroke="#FF2BD6" stroke-width="2"/>
    </g>
  </g>
</svg>
