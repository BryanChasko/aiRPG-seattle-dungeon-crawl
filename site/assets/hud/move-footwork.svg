<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Footwork move">
  <title>Footwork</title>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="46" height="46" rx="8" fill="#0B0E14" stroke="#1FBF75" stroke-width="2"/>
  <g class="motion" fill="none" stroke="#1FBF75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="-4,0;4,0;-4,0" dur="1.2s" repeatCount="indefinite"/>
    <polyline points="12,12 22,24 12,36"/>
    <polyline points="26,12 36,24 26,36"/>
  </g>
  <g class="static" fill="none" stroke="#1FBF75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="12,12 22,24 12,36"/>
    <polyline points="26,12 36,24 26,36"/>
  </g>
</svg>
