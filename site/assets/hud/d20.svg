<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Twenty-sided die">
  <title>d20</title>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="10" fill="#0B0E14" stroke="#FF2BD6" stroke-width="2"/>
  <g class="motion" fill="none" stroke-linejoin="round">
    <polygon points="60,32 46,56 18,56 4,32 18,8 46,8" stroke="#FF2BD6" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <g stroke="#1FBF75" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="14s" repeatCount="indefinite"/>
      <polygon points="32,32 46,8 18,8"/>
      <polygon points="32,32 60,32 46,8"/>
      <polygon points="32,32 46,56 60,32"/>
      <polygon points="32,32 18,56 46,56"/>
      <polygon points="32,32 4,32 18,56"/>
      <polygon points="32,32 18,8 4,32"/>
    </g>
    <circle cx="32" cy="32" r="3" fill="#FF8A3D" stroke="none"/>
  </g>
  <g class="static" fill="none" stroke-linejoin="round">
    <polygon points="60,32 46,56 18,56 4,32 18,8 46,8" stroke="#FF2BD6" stroke-width="2.5"/>
    <g stroke="#1FBF75" stroke-width="1.5">
      <polygon points="32,32 46,8 18,8"/>
      <polygon points="32,32 60,32 46,8"/>
      <polygon points="32,32 46,56 60,32"/>
      <polygon points="32,32 18,56 46,56"/>
      <polygon points="32,32 4,32 18,56"/>
      <polygon points="32,32 18,8 4,32"/>
    </g>
    <circle cx="32" cy="32" r="3" fill="#FF8A3D" stroke="none"/>
  </g>
</svg>
