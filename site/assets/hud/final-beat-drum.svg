<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Final beat drum">
  <title>Final Beat</title>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="62" height="62" rx="10" fill="#0B0E14" stroke="#FF8A3D" stroke-width="2"/>
  <g class="motion">
    <ellipse cx="32" cy="40" rx="16" ry="6" fill="none" stroke="#FF2BD6" stroke-width="2">
      <animate attributeName="rx" values="8;24" dur="1.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.5s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="32" cy="40" rx="16" ry="6" fill="none" stroke="#FF2BD6" stroke-width="2">
      <animate attributeName="rx" values="8;24" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.5s" begin="0.75s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="18" y="28" width="28" height="16" rx="3" fill="#FF8A3D"/>
    <ellipse cx="32" cy="28" rx="14" ry="5" fill="#0B0E14" stroke="#FF8A3D" stroke-width="2.5"/>
    <line x1="20" y1="14" x2="28" y2="25" stroke="#1FBF75" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="14;18;14" dur="0.75s" repeatCount="indefinite"/>
    </line>
    <line x1="44" y1="14" x2="36" y2="25" stroke="#1FBF75" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="14;18;14" dur="0.75s" begin="0.375s" repeatCount="indefinite"/>
    </line>
  </g>
  <g class="static">
    <rect x="18" y="28" width="28" height="16" rx="3" fill="#FF8A3D"/>
    <ellipse cx="32" cy="28" rx="14" ry="5" fill="#0B0E14" stroke="#FF8A3D" stroke-width="2.5"/>
    <line x1="20" y1="14" x2="28" y2="25" stroke="#1FBF75" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="14" x2="36" y2="25" stroke="#1FBF75" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
