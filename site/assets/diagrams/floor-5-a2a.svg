<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Three agents reporting to one Narrator orchestrator">
  <title>Four processes, one orchestrator</title>
  <desc>Three agent boxes across the top, each lined to one orchestrator box below; a pulse travels down the middle line.</desc>
  <style>
    .static{display:none}
    @media (prefers-reduced-motion: reduce){
      .motion{display:none}
      .static{display:inline}
    }
  </style>
  <rect x="1" y="1" width="478" height="238" rx="10" fill="#0B0E14" stroke="#6A2C91" stroke-width="2"/>
  <g fill="none" stroke="#B04CE0" stroke-width="3">
    <rect x="20" y="20" width="130" height="56" rx="8"/>
    <rect x="175" y="20" width="130" height="56" rx="8"/>
    <rect x="330" y="20" width="130" height="56" rx="8"/>
  </g>
  <rect x="175" y="164" width="130" height="56" rx="8" fill="none" stroke="#2EC4B6" stroke-width="3"/>
  <g stroke="#8A6D3B" stroke-width="3" fill="none">
    <path d="M 85,76 L 85,120 L 240,120 L 240,164"/>
    <path d="M 240,76 L 240,164"/>
    <path d="M 395,76 L 395,120 L 240,120 L 240,164"/>
  </g>
  <g class="motion">
    <circle r="7" fill="#2EC4B6">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 240,76 L 240,164"/>
    </circle>
  </g>
  <g class="static">
    <circle cx="240" cy="120" r="7" fill="#2EC4B6"/>
  </g>
</svg>
