[project]
name = "airpg-seattle-dungeon-crawl"
version = "1.0.0"
description = "Learn the Strands Agents SDK by building the System, the AI that runs a LitRPG dungeon crawl under Seattle, one floor at a time"
requires-python = ">=3.10"
dependencies = [
    # Strands Agents SDK — floor pinned to the release the workshop instructions were
    # last checked against (Oct 2026 docs). Floors 5 and 7 pass make_a2a_client a list of
    # endpoints, the form introduced in 1.57.2.
    "strands-agents[a2a]>=1.61",
    # Strands harness — the pre-assembled agent used in Floor 7 (create_harness).
    "strands-harness>=0.3",

    # Web Framework for APIs
    "fastapi[standard]",
    "pydantic",
    "uvicorn",

    # Knowledge Base — Floor 5 indexes the Crawl Handbook (Markdown) in a local ChromaDB
    "chromadb",
    # PDF text extraction for The Paper Trail, the optional Floor 5 encounter that adds a PDF to that knowledge base
    "pypdf>=5",

    # Database
    "tinydb",

    # Configuration — Floor 8 reads the URLs of the deployed runtimes from a .env file
    "python-dotenv",

    # Model Context Protocol — imported directly by the Floor 4 server, so declared here rather
    # than inherited from strands-agents. Ceiling pinned because mcp 2.0 renamed the server class
    # the floor teaches (mcp.server.FastMCP -> MCPServer) and moved port= from the constructor
    # to run(transport="streamable-http", port=...). The clients use MCPClient(url=...) and import
    # nothing from mcp. Do not raise this ceiling until Floor 4 and the workshop catalog are
    # ported together — see issue #50.
    "mcp<2",

    # IAM-signed MCP transport: a local or deployed agent calling an MCP server on AgentCore Runtime
    # (Floor 8).
    "mcp-proxy-for-aws",

    # AWS SDK — imported directly by Floor 8 (ui_proxy calls invoke_agent_runtime), so declared
    # here rather than inherited from strands-agents, whose floor (1.26) predates AgentCore.
    # 1.40 is the first release with the bedrock-agentcore stop_runtime_session operation.
    "boto3>=1.40",
]

[tool.uv]
required-environments = [
#"sys_platform == 'darwin' and platform_machine == 'x86_64'",
"sys_platform == 'darwin' and platform_machine == 'x86_64' and python_full_version < '3.14'",
]
